services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      ALLOWED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
    volumes:
      - continuum-data:/app/data
    restart: unless-stopped
volumes:
  continuum-data:
